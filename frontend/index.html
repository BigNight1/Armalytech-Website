        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-HMN89LH95T';
        script.onload = function () {
          gtag('js', new Date());
          gtag('config', 'G-HMN89LH95T');
        };
        document.head.appendChild(script);
      }
      if (window.requestIdleCallback) {
        window.addEventListener('load', function () { requestIdleCallback(loadGtag, { timeout: 4000 }); });
      } else {
        window.addEventListener('load', function () { setTimeout(loadGtag, 2500); });
      }
